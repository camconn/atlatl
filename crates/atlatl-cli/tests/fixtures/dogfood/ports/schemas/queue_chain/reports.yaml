schema:
  fields:
    id: {type: string, nullable: false}
    year: {type: integer, nullable: false}
    period: {type: string, nullable: false, values: [FY, P1, P2, P3, P4]}
    start_date: {type: date}
    end_date: {type: date}
    filed_date: {type: date}
    kind: {type: string, values: [income, balance, cashflow]}
    entity_id: {type: string, nullable: false}
    reg_no: {type: string}
    code: {type: string}
