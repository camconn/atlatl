[project]
name = "atlatl-dbt-compat"
description = "Checks that the consumer's dbt-duckdb reads and writes what atlatl writes"
version = "0"
requires-python = ">=3.12"
# Pinned to the consumer's lock: atlatl links the same DuckDB (spec 12 §3, open question 9).
dependencies = ["dbt-core==1.11.12", "dbt-duckdb==1.11.0", "duckdb==1.5.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.380"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.pyright]
include = ["tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
