# Estimate actuals. The daily full merge and the hourly `update_key` delta write the same tables,
# so they move together and share one op (one process) and a lock_group. Rows with a NULL
# `published_on` never move hourly; the daily merge covers them.
replications:
  acme_actuals:
    source: warehouse
    target: lake
    op: acme_actuals
    lock_group: acme
    retry: {max_attempts: 2, base: 10ms, max: 50ms}
    defaults:
      mode: incremental
      object: "br.{{ member.table }}"
    streams:
      - {id: acme/est/est_basic_act, from: {tables: "est.est_basic_act_*"}, primary_key: [sec_id, metric, fp_end]}
      - {id: acme/est/est_adv_act, from: {tables: "est.est_adv_act_*"}, primary_key: [sec_id, metric, fp_end]}

  acme_hourly_actuals:
    source: warehouse
    target: lake
    op: acme_actuals
    lock_group: acme
    retry: {max_attempts: 2, base: 10ms, max: 50ms}
    defaults:
      mode: incremental
      object: "br.{{ member.table }}"
      update_key: published_on
      # Chunked too: the watermark comes from every file group.
      chunk: {by: files, size: 1B}
    streams:
      - {id: acme_hourly/est/est_basic_act, from: {tables: "est.est_basic_act_*"}, primary_key: [sec_id, metric, fp_end]}
      - {id: acme_hourly/est/est_adv_act, from: {tables: "est.est_adv_act_*"}, primary_key: [sec_id, metric, fp_end]}
