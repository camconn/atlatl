# Hourly delta into the same br tables the daily replications full-merge; hence the shared lock_group.
replications:
  warehouse_hourly_est_actuals:
    source: warehouse
    target: lake
    op: warehouse_hourly_est_actuals
    lock_group: warehouse
    engine: {threads: 4}
    asset: {group: warehouse_hourly, description: "Hourly delta of warehouse estimate actuals into br"}
    defaults:
      mode: incremental
      object: "br.{{ member.table }}"
    streams:
      - id: warehouse_hourly/est_v2/est_core_act
        from: {tables: "est_v2.est_core_act_*"}
        primary_key: [sym_id, item_code, period_end]
        update_key: publication_date
        asset: {key: br/warehouse_hourly/est_v2/est_core_act, deps: [est_v2/est_core_act__]}
      - id: warehouse_hourly/est_v2/est_plus_act
        from: {tables: "est_v2.est_plus_act_*"}
        primary_key: [sym_id, item_code, period_end]
        update_key: publication_date
        asset: {key: br/warehouse_hourly/est_v2/est_plus_act, deps: [est_v2/est_plus_act__]}
