# cargo-about config for the Rust part of LICENSE-THIRD-PARTY (scripts/third-party-licenses.sh).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# atlatl's own crates (publishable, so not `private`). AGPL is accepted for them alone, and
# about.hbs leaves the AGPL block out: these notices are for third-party code.
[atlatl-cdc]
accepted = ["AGPL-3.0-or-later"]
[atlatl-cli]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-clickhouse]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-delta]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-ducklake]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-files]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-pgrepl]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-postgres]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-redshift]
accepted = ["AGPL-3.0-or-later"]
[atlatl-conn-sqlite]
accepted = ["AGPL-3.0-or-later"]
[atlatl-core]
accepted = ["AGPL-3.0-or-later"]
[atlatl-engine]
accepted = ["AGPL-3.0-or-later"]
[atlatl-http]
accepted = ["AGPL-3.0-or-later"]
[atlatl-ingest]
accepted = ["AGPL-3.0-or-later"]
[atlatl-run]
accepted = ["AGPL-3.0-or-later"]
[atlatl-state]
accepted = ["AGPL-3.0-or-later"]
