# Two replications on one connection-scoped limiter, so a throttled run only re-runs the half
# that failed.
replications:
  throttled_releases:
    source: throttled
    target: lake
    streams:
      - id: throttled/releases
        from: {endpoint: releases}
        object: br.releases
        mode: incremental
        primary_key: [Code, Tag, Date]
  throttled_symbols:
    source: throttled
    target: lake
    streams:
      - id: throttled/symbols
        from: {endpoint: symbols}
        object: br.symbols
        mode: incremental
        primary_key: [Code]
